<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040e1f" />
      <stop offset="50%" stop-color="#081425" />
      <stop offset="100%" stop-color="#152031" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="160" stroke="#2a3548" stroke-width="6" stroke-dasharray="8 8" opacity="0.6"/>
  
  <!-- Neural Nexo Connection Nodes -->
  <path d="M160 350 L256 160 L352 350 L256 280 Z" fill="url(#accentGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="160" r="28" fill="#38bdf8" />
  <circle cx="160" cy="350" r="24" fill="#7c3aed" />
  <circle cx="352" cy="350" r="24" fill="#3b82f6" />
  <circle cx="256" cy="280" r="18" fill="#ffffff" />
</svg>
